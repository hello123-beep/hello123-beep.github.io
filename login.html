<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Madmin - 로그인</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            padding: 40px;
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }
        
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 5px;
            text-align: center;
            font-size: 14px;
            display: none;
        }
        
        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }
        
        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }
        
        .links {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
        }
        
        .links a {
            color: #667eea;
            text-decoration: none;
            margin: 0 5px;
        }
        
        .links a:hover {
            text-decoration: underline;
        }
        
        .divider {
            text-align: center;
            margin: 25px 0;
            color: #999;
            font-size: 12px;
        }
        
        .divider::before,
        .divider::after {
            content: '';
            display: inline-block;
            width: 45%;
            height: 1px;
            background: #ddd;
            vertical-align: middle;
        }
        
        .divider::before {
            margin-right: 10px;
        }
        
        .divider::after {
            margin-left: 10px;
        }
        
        .social-login {
            display: flex;
            gap: 10px;
        }
        
        .social-btn {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background: white;
            color: #333;
            font-weight: 600;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
        }
        
        .social-btn:hover {
            background: #f5f5f5;
            border-color: #667eea;
        }
        
        .remember {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Madmin</h1>
        <p class="subtitle">로그인</p>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="username">사용자명</label>
                <input 
                    type="text" 
                    id="username" 
                    placeholder="사용자명 입력" 
                    required
                >
            </div>
            
            <div class="form-group">
                <label for="password">비밀번호</label>
                <input 
                    type="password" 
                    id="password" 
                    placeholder="비밀번호 입력" 
                    required
                >
            </div>
            
            <div class="remember">
                <input type="checkbox" id="remember">
                <label for="remember" style="margin: 0; font-weight: normal;">로그인 상태 유지</label>
            </div>
            
            <button type="submit">로그인</button>
        </form>
        
        <div id="message" class="message"></div>
        
        <div class="divider">또는</div>
        
        <div class="social-login">
            <button class="social-btn" onclick="window.location.href='github-signup.html'">⭐ GitHub</button>
            <button class="social-btn" onclick="window.location.href='guest-signup.html'">👤 게스트</button>
        </div>
        
        <div class="links">
            <a href="/">돌아가기</a> | 
            <a href="guest-signup.html">계정 생성</a>
        </div>
    </div>

    <script>
        // 로그인 폼 제출
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const remember = document.getElementById('remember').checked;
            
            // localStorage에서 사용자 확인
            const users = JSON.parse(localStorage.getItem('madmin_users') || '{}');
            
            if (!users[username]) {
                showMessage('존재하지 않는 사용자명입니다.', 'error');
                return;
            }
            
            // 비밀번호 확인
            const storedPassword = users[username].password;
            if (btoa(password) !== storedPassword) {
                showMessage('비밀번호가 일치하지 않습니다.', 'error');
                return;
            }
            
            // 로그인 성공
            const userData = {
                username: username,
                loginTime: new Date().toISOString()
            };
            
            localStorage.setItem('madmin_currentUser', JSON.stringify(userData));
            
            if (remember) {
                localStorage.setItem('madmin_rememberMe', 'true');
            }
            
            showMessage(`✓ ${username}님 환영합니다!`, 'success');
            
            // 2초 후 대시보드로 이동 (또는 홈)
            setTimeout(() => {
                window.location.href = '/';
            }, 2000);
        });
        
        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = text;
            messageDiv.className = `message ${type}`;
        }
        
        // 페이지 로드 시 자동 로그인 확인
        window.addEventListener('load', function() {
            const rememberMe = localStorage.getItem('madmin_rememberMe');
            const currentUser = localStorage.getItem('madmin_currentUser');
            
            if (rememberMe === 'true' && currentUser) {
                const user = JSON.parse(currentUser);
                setTimeout(() => {
                    window.location.href = '/';
                }, 1000);
            }
        });
    </script>
</body>
</html>
